name: Publish

on:
  push:
    tags: ["trogon-eventstore-*@v*"]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install and build
        run: |
          yarn install --immutable
          yarn build
      - name: Pack packages
        run: |
          mkdir packages-out
          yarn workspace @trogonstack/trogon-eventstore-client pack --out ../../packages-out/client.tgz
          yarn workspace @trogonstack/trogon-eventstore-opentelemetry pack --out ../../packages-out/opentelemetry.tgz
      - name: Upload package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-packages
          path: packages-out

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@trogonstack'
      - name: Download package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-packages
          path: packages-out
      - name: Publish tagged package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          case "$RELEASE_TAG" in
            trogon-eventstore-client@v*) npm publish packages-out/client.tgz --access public ;;
            trogon-eventstore-opentelemetry@v*) npm publish packages-out/opentelemetry.tgz --access public ;;
            *) echo "Unexpected release tag: $RELEASE_TAG" >&2; exit 1 ;;
          esac
